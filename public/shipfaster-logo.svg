<svg viewBox="0 0 280 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sfSGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="64" y2="64">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <linearGradient id="sfFGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="64" y2="64">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="60%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <linearGradient id="sfArrowAccent" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="64" y2="24">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <linearGradient id="sfTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
  </defs>

  <!-- SF Monogram Emblem Mark -->
  <g transform="translate(0, 0)">
    <!-- S Loop Curve -->
    <path 
      d="M 26 12 C 16 12 10 18 10 26 C 10 35 17 37 25 40 C 33 43 37 46 37 53 C 37 60 30 63 20 63 C 12 63 8 57 7 51" 
      stroke="url(#sfSGrad)" 
      stroke-width="7.5" 
      stroke-linecap="round" 
    />

    <!-- Connected F Vertical & Horizontal Bar -->
    <path 
      d="M 37 12 L 50 12 M 37 27 L 49 27 M 37 12 L 37 63" 
      stroke="url(#sfFGrad)" 
      stroke-width="7.5" 
      stroke-linecap="round" 
    />

    <!-- Speed Forward Arrowhead -->
    <path 
      d="M 48 4 L 60 12 L 48 20 Z" 
      fill="url(#sfArrowAccent)" 
    />
  </g>

  <!-- Brand Typography (Natural Letter-Spacing for LOGISTIC) -->
  <text x="76" y="38" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#0F172A" letter-spacing="-0.5">Ship<tspan fill="url(#sfTextGrad)">Faster</tspan></text>
  <text x="77" y="54" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="10.5" fill="#2563EB" letter-spacing="2.2">LOGISTIC</text>
</svg>
